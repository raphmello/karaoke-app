# For writing migrations: `alembic revision --autogenerate -m "..."` inside a container with the data volume.
# The API and the worker apply them on their own at start (karaoke.core.db.migrate).
[alembic]
script_location = karaoke/migrations

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
