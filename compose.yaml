# The whole app on the PC (docs/ARCHITECTURE.md, deployment): `docker compose up -d`, then http://<PC's IP>:8080.
# With `--profile remote`, cloudflared also publishes it on the Cloudflare Tunnel (token in .env).
# Only Caddy is exposed. The bind mounts of ./backend are for development: code changes without rebuilding.
name: karaoke

services:
  caddy:
    build:
      context: .
      dockerfile: docker/caddy.Dockerfile
    image: karaoke-caddy
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - karaoke-data:/srv/karaoke:ro  # Caddy keeps its own state in /data, so the volume goes elsewhere
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: karaoke-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      - karaoke-data:/data
      - ./backend/karaoke:/app/karaoke
    # development: reloads on code changes (and, with it, logs the host out)
    command: ["uvicorn", "--factory", "karaoke.api.app:create_app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*", "--reload", "--reload-dir", "/app/karaoke"]

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: karaoke-worker
    restart: unless-stopped
    command: ["worker"]  # `docker compose run --rm worker process <video>` still processes one video by hand
    env_file:
      - path: .env
        required: false
    volumes:
      - karaoke-data:/data
      - ./backend/karaoke:/app/karaoke
      - ./backend/tests:/app/tests
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
    depends_on:
      - api
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # The Cloudflare Tunnel: created in the Cloudflare dashboard, public hostname -> http://caddy:8080.
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["remote"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}  # empty: cloudflared stops and says the token is missing
    depends_on:
      - caddy

volumes:
  karaoke-data:
